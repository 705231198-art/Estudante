<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros - Núcleo UCM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/logos/logo-ucm.png">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-users"></i>
                </div>
                <h1>Área de Membros</h1>
                <p>Núcleo dos Estudantes - UCM</p>
            </div>
            
            <!-- Aviso: Email institucional -->
            <div class="auth-info" style="background: #e7f3ff; border-left: 4px solid #0056a9; padding: 12px; margin-bottom: 20px; border-radius: 4px;">
                <p style="margin: 0; font-size: 14px; color: #003366;">
                    <i class="fas fa-info-circle"></i> <strong>Acesso com Email Institucional</strong><br>
                    Use seu código de estudante + @ucm.ac.mz<br>
                    Exemplo: <code style="background: #fff; padding: 2px 6px; border-radius: 3px;">705231198@ucm.ac.mz</code>
                </p>
            </div>
            
            <!-- Formulário de Login -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Institucional
                    </label>
                    <input type="email" id="email" required 
                           placeholder="codigoestudante@ucm.ac.mz"
                           autocomplete="email">
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Manter conectado</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                
                <div class="auth-divider">
                    <span>OU</span>
                </div>
                
                <a href="index.html" class="btn btn-outline auth-btn">
                    <i class="fas fa-home"></i> Voltar ao Site
                </a>
            </form>
            

            
            <!-- Mensagens -->
            <div class="auth-messages" id="authMessages"></div>
            
            <!-- Informações -->
            <div class="auth-info">
                <h3><i class="fas fa-info-circle"></i> Informações</h3>
                <p>Acesso restrito aos membros da direção do Núcleo.</p>
                <p class="contact-info">
                    <i class="fas fa-envelope"></i> admin@nucleo.ucm.ac.mz<br>
                    <i class="fas fa-phone"></i> +258 84 123 4567
                </p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
